# phpNuxBill — CVPAP deployment compose
#
# The database is NOT a container: phpNuxBill uses the VM's own MariaDB/MySQL
# (survives container rebuilds, joins host backups). See
# CVPAP/docs/WIFI_NUXBILL_DEPLOYMENT.md §1a for the host DB setup:
#   - database `nuxbill`, user 'nuxbill'@'172.%'
#   - bind-address 0.0.0.0 + firewall: 3306 allowed only from 172.16.0.0/12
#
# In the web installer use DB host `host.docker.internal`.
#
# The container joins CVPAP's compose network so the CVPAP backend reaches it
# at http://nuxbill/system/api.php without publishing the API anywhere.

# Explicit project name so a symlinked compose file can't derive an unstable
# name (otherwise `up` looks for nuxbill-nuxbill:latest and misses the build).
name: nuxbill

services:
  nuxbill:
    container_name: nuxbill
    build: ./
    image: nuxbill:latest    # pin the built image name → build & run always agree
    restart: unless-stopped
    ports:
      - "127.0.0.1:39090:80"   # admin UI: loopback-only, access via SSH tunnel
    environment:
      TZ: Africa/Nairobi
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the VM's MariaDB
    volumes:
      # data lives on the big volume; source code stays on the system disk.
      # Seed uploads once from the repo before first start:
      #   rsync -a --ignore-existing system/uploads/ /mnt/HC_Volume_103347833/nuxbill/uploads/
      - /mnt/HC_Volume_103347833/nuxbill/uploads:/var/www/html/system/uploads
      - /mnt/HC_Volume_103347833/nuxbill/config.php:/var/www/html/config.php

networks:
  default:
    name: cvpap_app-network    # ← CVPAP's network (`docker network ls | grep app-network`)
    external: true
